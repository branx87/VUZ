<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — VUZ Bot Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">🎓 VUZ Bot Admin</h1>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded p-3 mb-4 text-sm">
      Неверный токен. Попробуй ещё раз.
    </div>
    {% endif %}

    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="/admin/schedule">
      <label class="block text-sm font-medium text-gray-700 mb-1">Токен администратора</label>
      <input
        type="password"
        name="token"
        autofocus
        class="w-full border rounded px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        placeholder="Введи ADMIN_SECRET_TOKEN из .env"
      >
      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded transition"
      >
        Войти
      </button>
    </form>
  </div>
</body>
</html>
