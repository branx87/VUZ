{% extends "base.html" %}
{% block title %}Редактировать пару — Admin{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="flex items-center gap-3 mb-6">
    <a href="/admin/schedule?week={{ entry.session_week.isoformat() }}" class="text-indigo-600 hover:underline text-sm">← Назад</a>
    <h1 class="text-2xl font-bold">✏️ Редактировать пару</h1>
  </div>

  <div class="bg-white rounded-xl shadow p-6">
    <form method="post" action="/admin/schedule/entry/{{ entry.id }}/edit"
          class="grid grid-cols-2 gap-4 text-sm">
      <input type="hidden" name="session_week" value="{{ entry.session_week.isoformat() }}">
      <div>
        <label class="block text-gray-600 mb-1">День недели</label>
        <select name="day_of_week" class="w-full border rounded px-2 py-1.5" id="dow-select">
          {% for i in range(6) %}
          <option value="{{ i }}" {% if entry.day_of_week == i %}selected{% endif %}
                  data-dow="{{ i }}">{{ day_names[i] }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-gray-600 mb-1">Пара №</label>
        <select name="pair_number" id="edit_pair_number"
                onchange="fillPairTime(this,'edit_time_start','edit_time_end')"
                class="w-full border rounded px-2 py-1.5">
          <option value="1" {% if entry.pair_number == 1 %}selected{% endif %}>1 пара (08:15–09:45)</option>
          <option value="2" {% if entry.pair_number == 2 %}selected{% endif %}>2 пара (10:00–11:30)</option>
          <option value="3" {% if entry.pair_number == 3 %}selected{% endif %}>3 пара (11:45–13:15)</option>
          <option value="4" {% if entry.pair_number == 4 %}selected{% endif %}>4 пара (13:45–15:15)</option>
          <option value="5" {% if entry.pair_number == 5 %}selected{% endif %}>5 пара (15:25–16:55)</option>
          <option value="6" {% if entry.pair_number == 6 %}selected{% endif %}>6 пара (17:05–18:35)</option>
          <option value="7" {% if entry.pair_number == 7 %}selected{% endif %}>7 пара (18:45–20:15)</option>
          <option value="8" {% if entry.pair_number == 8 %}selected{% endif %}>8 пара (20:25–21:55)</option>
        </select>
      </div>
      <div>
        <label class="block text-gray-600 mb-1">Начало</label>
        <input type="time" name="time_start" id="edit_time_start"
               value="{{ entry.time_start.strftime('%H:%M') }}"
               class="w-full border rounded px-2 py-1.5" readonly>
      </div>
      <div>
        <label class="block text-gray-600 mb-1">Конец</label>
        <input type="time" name="time_end" id="edit_time_end"
               value="{{ entry.time_end.strftime('%H:%M') }}"
               class="w-full border rounded px-2 py-1.5" readonly>
      </div>
      <div class="col-span-2">
        <label class="block text-gray-600 mb-1">Предмет *</label>
        <select name="subject" required class="w-full border rounded px-2 py-1.5">
          {% for s in subjects %}
          <option value="{{ s.name }}" {% if s.name == entry.subject %}selected{% endif %}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-gray-600 mb-1">Преподаватель</label>
        <select name="teacher" class="w-full border rounded px-2 py-1.5">
          <option value="" {% if not entry.teacher %}selected{% endif %}>— не выбрано —</option>
          {% for t in teachers %}
          <option value="{{ t.full_name }}" {% if t.full_name == entry.teacher %}selected{% endif %}>{{ t.full_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-gray-600 mb-1">Аудитория</label>
        <input type="text" name="room"
               value="{{ entry.room or '' }}"
               class="w-full border rounded px-2 py-1.5">
      </div>
      <div>
        <label class="block text-gray-600 mb-1">Подгруппа</label>
        <select name="subgroup" class="w-full border rounded px-2 py-1.5">
          <option value=""  {% if not entry.subgroup %}selected{% endif %}>Все</option>
          <option value="1" {% if entry.subgroup == 1  %}selected{% endif %}>1</option>
          <option value="2" {% if entry.subgroup == 2  %}selected{% endif %}>2</option>
        </select>
      </div>
      <div class="col-span-2 flex justify-end gap-3 pt-2">
        <a href="/admin/schedule?week={{ entry.session_week.isoformat() }}"
           class="border border-gray-300 text-gray-600 hover:bg-gray-50 px-4 py-1.5 rounded text-sm">
          Отмена
        </a>
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded text-sm font-medium">
          Сохранить
        </button>
      </div>
    </form>
  </div>
</div>

<script>
const PAIR_TIMES = {
  1: ["08:15","09:45"], 2: ["10:00","11:30"], 3: ["11:45","13:15"],
  4: ["13:45","15:15"], 5: ["15:25","16:55"], 6: ["17:05","18:35"],
  7: ["18:45","20:15"], 8: ["20:25","21:55"]
};
function fillPairTime(selectEl, startId, endId) {
  const times = PAIR_TIMES[selectEl.value];
  if (times) {
    document.getElementById(startId).value = times[0];
    document.getElementById(endId).value = times[1];
  }
}
document.addEventListener('DOMContentLoaded', function() {
  const sessionWeek = new Date("{{ entry.session_week.isoformat() }}");
  const sel = document.getElementById('dow-select');
  Array.from(sel.options).forEach(opt => {
    const d = new Date(sessionWeek);
    d.setDate(d.getDate() + parseInt(opt.dataset.dow));
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    opt.textContent = opt.textContent.trim() + ` (${day}.${month})`;
  });
});
</script>
{% endblock %}
