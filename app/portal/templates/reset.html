<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый пароль — VUZ Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-4 text-center">🔑 Новый пароль</h1>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded p-3 mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/portal/reset" class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required
               class="w-full border rounded px-3 py-2 text-sm"
               placeholder="ivan@example.com">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Код из бота (6 цифр)</label>
        <input type="text" name="code" required maxlength="6" pattern="[0-9]{6}"
               class="w-full border rounded px-3 py-2 text-sm text-center text-lg tracking-widest"
               placeholder="123456" autofocus>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Новый пароль (мин. 6)</label>
        <input type="password" name="password" required minlength="6"
               class="w-full border rounded px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Повторите пароль</label>
        <input type="password" name="password2" required minlength="6"
               class="w-full border rounded px-3 py-2 text-sm">
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded transition">
        Установить пароль
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      <a href="/portal/forgot" class="text-indigo-600 hover:underline">← Запросить новый код</a>
    </p>
  </div>
</body>
</html>
