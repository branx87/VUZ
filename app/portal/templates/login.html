<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — VUZ Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-6 text-center">🎓 VUZ Bot</h1>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 rounded p-3 mb-4 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/portal/login" class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full border rounded px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Пароль</label>
        <input type="password" name="password" required
               class="w-full border rounded px-3 py-2 text-sm">
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded transition">
        Войти
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      <a href="/portal/forgot" class="text-indigo-600 hover:underline">Забыл пароль?</a>
    </p>
    <p class="text-center text-sm text-gray-500 mt-2">
      Ещё нет аккаунта?
      <a href="/portal/register" class="text-indigo-600 hover:underline">Зарегистрироваться</a>
    </p>
  </div>
</body>
</html>
